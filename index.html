<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Карта поездки</title>
</head>
<body>
<div class="app">
  <header>
    <div class="topline"><h1>Карта поездки</h1><span class="editor-badge" id="modeLabel"></span></div>
    <nav class="tabs" aria-label="Город">
      <button class="tab" data-city="minsk">Минск</button>
      <button class="tab" data-city="brest">Брест</button>
      <button class="tab" data-city="grodno" aria-selected="true">Гродно</button>
    </nav>
    <div class="filters" aria-label="Категория">
      <button class="filter active" data-filter="all">Все</button>
      <button class="filter" data-filter="history">История</button>
      <button class="filter" data-filter="beautiful">Красивое</button>
      <button class="filter" data-filter="park">Парки</button>
      <button class="filter" data-filter="food">Еда</button>
      <button class="filter" data-filter="coffee">Кофе</button>
    </div>
  </header>

  <main>
    <div id="map">
      <div class="empty" id="empty">Для этого города точек пока нет.</div>
      <div class="map-controls">
        <button id="zoomIn" type="button" aria-label="Увеличить">+</button>
        <button id="zoomOut" type="button" aria-label="Уменьшить">−</button>
      </div>
      <button class="add-btn" id="addBtn" type="button">+ Добавить</button>

      <section class="sheet" id="sheet" aria-live="polite">
        <div class="handle"></div>
        <div class="sheet-head">
          <div><h2 id="placeTitle"></h2><div class="tags" id="placeTags"></div></div>
          <button class="close" id="closeSheet" type="button">×</button>
        </div>
        <p id="placeText"></p>
        <p class="address" id="placeAddress"></p>
        <div class="hours-chip" id="placeHours" hidden></div>
        <p class="source" id="placeSource"></p>
      </section>

      <div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
    </div>

    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <form class="form-card" id="placeForm">
        <div class="handle"></div>
        <h2>Добавить точку</h2>
        <div class="form-grid">
          <div class="field full"><label for="name">Название</label><input id="name" name="name" required></div>
          <div class="field"><label for="city">Город</label>
            <select id="city" name="city"><option value="minsk">Минск</option><option value="brest">Брест</option><option value="grodno">Гродно</option></select>
          </div>
          <div class="field"><label for="category">Категория</label>
            <select id="category" name="category">
              <option value="history">История / архитектура</option><option value="beautiful">Красивая локация</option>
              <option value="park">Парк</option><option value="food">Еда</option><option value="coffee">Кофейня</option>
            </select>
          </div>
          <div class="field full"><label for="address">Адрес</label><input id="address" name="address" placeholder="Например: Комсомольская 32" required></div>
          <div class="field full"><label for="source">Ссылка-источник</label><input id="source" name="source" type="url" placeholder="Instagram / сайт / карта"></div>
          <div class="field full"><label for="opening_hours">График работы</label><input id="opening_hours" name="opening_hours" placeholder="Например: Пн–Пт 09:00–22:00; Сб–Вс 10:00–23:00"></div>
          <div class="field full"><label for="note">Короткая заметка</label><textarea id="note" name="note"></textarea></div>
          <label class="vegan-row full" id="veganRow"><input type="checkbox" id="vegan" name="vegan"> 🌿 Vegan-friendly</label>
        </div>
        <div class="actions"><button type="button" id="cancelBtn">Отмена</button><button class="save" type="submit">Сохранить</button></div>
        <div class="form-status" id="formStatus"></div>
      </form>
    </div>
  </main>
</div>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
