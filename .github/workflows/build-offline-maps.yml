name: Build offline city maps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLANET_URL: https://build.protomaps.com/20260730.pmtiles
      PMTILES_IMAGE: ghcr.io/protomaps/go-pmtiles:v1.31.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull PMTiles CLI image
        run: |
          docker pull "$PMTILES_IMAGE"
          docker run --rm "$PMTILES_IMAGE" version || true

      - name: Extract Minsk
        run: |
          mkdir -p maps
          docker run --rm             -v "$PWD:/work"             -w /work             "$PMTILES_IMAGE"             extract "$PLANET_URL" maps/minsk.pmtiles             --bbox=27.30,53.75,27.85,54.06             --maxzoom=15             --overfetch=0

      - name: Extract Brest
        run: |
          docker run --rm             -v "$PWD:/work"             -w /work             "$PMTILES_IMAGE"             extract "$PLANET_URL" maps/brest.pmtiles             --bbox=23.52,51.97,23.95,52.23             --maxzoom=15             --overfetch=0

      - name: Extract Grodno
        run: |
          docker run --rm             -v "$PWD:/work"             -w /work             "$PMTILES_IMAGE"             extract "$PLANET_URL" maps/grodno.pmtiles             --bbox=23.60,53.55,24.02,53.82             --maxzoom=15             --overfetch=0

      - name: Show sizes
        run: |
          ls -lh maps/*.pmtiles

      - name: Commit map packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/*.pmtiles
          git diff --cached --quiet && exit 0
          git commit -m "Build offline city map packs"
          git push
