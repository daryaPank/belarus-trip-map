# Supabase keepalive

Добавьте файл `.github/workflows/keep-supabase-awake.yml` в репозиторий.

Нужны два GitHub Actions secret:

- `SUPABASE_URL`
- `SUPABASE_PUBLISHABLE_KEY`

Workflow запускается раз в сутки в 06:17 UTC и делает безопасный read-only запрос:
`GET /rest/v1/places?select=id&limit=1`

Также его можно запустить вручную через:
Actions → Keep Supabase awake → Run workflow
